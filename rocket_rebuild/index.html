<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>BESKAR RUN — This is the Way</title>
<style>
  :root { --gold: #ffcc44; --steel: #9fd3c7; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #05060a;
    overflow: hidden;
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
    touch-action: none;
  }
  #wrap {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(ellipse at 50% 30%, #11203a 0%, #07080f 60%, #030308 100%);
  }
  canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #000;
    box-shadow: 0 0 0 3px #1a2b44, 0 0 40px #0a2540, 0 0 90px #04101f;
    border-radius: 6px;
    max-width: 100%; max-height: 100%;
  }
  #hint {
    position: fixed; bottom: 6px; left: 0; right: 0;
    text-align: center; color: #3a4d6b; font-size: 12px;
    letter-spacing: 1px; pointer-events: none;
  }
</style>
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="960" height="540"></canvas>
  </div>
  <div id="hint">Arrows / WASD move &nbsp;•&nbsp; auto-fire &nbsp;•&nbsp; Q weapon &nbsp;•&nbsp; F Force &nbsp;•&nbsp; P pause &nbsp;•&nbsp; M mute</div>
  <script src="game.js"></script>
</body>
</html>
