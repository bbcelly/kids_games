<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Bunny Pancake, Cat Milkshake</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Baloo+2:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#ff5fb0; --pink-d:#e0338f; --deep:#9c2f7a;
    --cream:#fff7fb;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "Fredoka", "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
    background: #ff9bd4;
    display: flex; align-items: center; justify-content: center;
    touch-action: manipulation; user-select: none; -webkit-user-select: none;
  }
  #stage {
    position: relative;
    width: 100%; height: 100%;
    max-width: 520px; max-height: 100vh;
    background: #ffd0ec;
    overflow: hidden;
    box-shadow: 0 0 60px rgba(156,47,122,.25) inset;
  }
  canvas { display: block; width: 100%; height: 100%; }

  .overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px; gap: 20px;
    background: radial-gradient(120% 90% at 50% 20%, rgba(255,225,244,.55), rgba(255,180,224,.72));
    backdrop-filter: blur(3px);
    z-index: 10;
    animation: fadeIn .35s ease both;
  }
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }
  .hidden { display: none !important; }

  .logo {
    font-family: "Baloo 2", "Fredoka", sans-serif;
    font-weight: 800; line-height: .98;
    font-size: clamp(38px, 12vw, 66px);
    letter-spacing: .5px;
    background: linear-gradient(180deg,#fff 0%,#ffd9ee 45%,#ff86c8 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    -webkit-text-stroke: 3px #fff;
    filter: drop-shadow(0 4px 0 var(--pink-d)) drop-shadow(0 10px 14px rgba(156,47,122,.4));
    transform: rotate(-3deg);
    animation: wobble 3s ease-in-out infinite;
  }
  @keyframes wobble { 0%,100%{transform:rotate(-3deg) translateY(0)} 50%{transform:rotate(-1deg) translateY(-6px)} }
  .subtitle {
    font-size: clamp(15px, 4.6vw, 20px); color: #fff; font-weight:600;
    max-width: 340px; line-height:1.35;
    text-shadow: 0 2px 0 var(--pink-d), 0 4px 10px rgba(156,47,122,.4);
  }
  .btn {
    font-family: "Baloo 2","Fredoka",sans-serif; font-weight: 800;
    font-size: clamp(22px, 6.5vw, 30px); color: #fff;
    background: linear-gradient(180deg,#ffe15a,#ffb038);
    border: 4px solid #fff; border-radius: 999px; padding: 15px 46px; cursor: pointer;
    box-shadow: 0 7px 0 #e0821b, 0 12px 22px rgba(224,130,27,.5);
    transition: transform .07s ease, box-shadow .07s ease;
    text-shadow: 0 2px 0 rgba(224,130,27,.55);
    animation: pop .5s cubic-bezier(.2,1.4,.4,1) both;
  }
  @keyframes pop { from{transform:scale(.6);opacity:0} to{transform:scale(1);opacity:1} }
  .btn:active { transform: translateY(5px); box-shadow: 0 2px 0 #e0821b, 0 4px 10px rgba(224,130,27,.5); }
  .final-score { font-family:"Baloo 2",sans-serif; font-size: clamp(30px, 9vw, 46px); font-weight: 800; color:#fff;
    text-shadow: 0 3px 0 var(--pink-d), 0 6px 14px rgba(156,47,122,.4); }
  .best { font-size: clamp(17px,5.4vw,23px); color:#fff; font-weight:700; text-shadow:0 2px 0 var(--pink-d); }
  .new-best { color:#fff; font-weight:800; font-size:clamp(15px,4.6vw,19px);
    background:linear-gradient(180deg,#ffe15a,#ffb038); padding:6px 18px; border-radius:999px;
    border:3px solid #fff; box-shadow:0 4px 0 #e0821b; animation: pop .5s .1s cubic-bezier(.2,1.4,.4,1) both; }
  .credit { position:absolute; bottom:12px; left:0; right:0; font-size:12px; color:#fff; opacity:.85; font-weight:600; letter-spacing:.3px;}
  #muteBtn{
    position:absolute; top:14px; left:50%; transform:translateX(-50%);
    display:none; z-index:9; width:44px;height:44px;border-radius:50%;
    border:3px solid #fff; background:rgba(255,255,255,.35); color:#fff;
    font-size:20px; cursor:pointer; line-height:1; padding:0;
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>
  <button id="muteBtn" aria-label="mute">🔊</button>

  <div id="titleScreen" class="overlay">
    <div class="logo">Bunny&nbsp;Pancake<br>Cat&nbsp;Milkshake</div>
    <div class="subtitle">Pancakes 🥞 for the bunny, milkshakes 🥤 for the cat! Tap the right side before the timer runs out.</div>
    <button id="playBtn" class="btn">Play!</button>
    <div class="credit">Inspired by Wreck-It Ralph 2</div>
  </div>

  <div id="gameoverScreen" class="overlay hidden">
    <div class="logo" style="font-size:clamp(34px,11vw,54px)">Yummy!</div>
    <div class="final-score" id="finalScore">Score: 0</div>
    <div id="newBest" class="new-best hidden">⭐ New Best! ⭐</div>
    <div class="best" id="bestScore">Best: 0</div>
    <button id="againBtn" class="btn">Play Again</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  const FONT = "'Fredoka','Baloo 2','Trebuchet MS',sans-serif";
  const FONT_B = "'Baloo 2','Fredoka',sans-serif";

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const stage = document.getElementById("stage");

  const titleScreen = document.getElementById("titleScreen");
  const gameoverScreen = document.getElementById("gameoverScreen");
  const finalScoreEl = document.getElementById("finalScore");
  const bestScoreEl = document.getElementById("bestScore");
  const newBestEl = document.getElementById("newBest");
  const muteBtn = document.getElementById("muteBtn");

  const W = 520, H = 900;
  let DPR = 1;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 3);
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener("resize", resize);

  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const TAU = Math.PI * 2;

  const STATE = { TITLE: 0, PLAYING: 1, GAMEOVER: 2 };
  let state = STATE.TITLE;

  const BEST_KEY = "bpcm_best";
  let best = parseInt(localStorage.getItem(BEST_KEY) || "0", 10) || 0;
  let muted = localStorage.getItem("bpcm_muted") === "1";

  // ---------- persistent cute scene (drawn on every screen) ----------
  function makeAnimal(kind, cx) {
    return { kind, cx, cy: H - 188, scale: 1, targetScale: 1, rot: 0,
      shakeT: 0, happyT: 0, blinkT: rand(1.5, 4), blink: 0 };
  }
  const scene = {
    t: 0,
    bunny: makeAnimal("bunny", W * 0.27),
    cat: makeAnimal("cat", W * 0.73),
    clouds: Array.from({ length: 4 }, (_, i) => ({
      x: rand(0, W), y: rand(70, 300), s: rand(0.7, 1.3), spd: rand(6, 16),
    })),
    sprinkles: Array.from({ length: 26 }, () => ({
      x: rand(0, W), y: rand(0, H), vy: rand(14, 34), rot: rand(0, TAU),
      vr: rand(-1.5, 1.5), len: rand(9, 16), hue: (Math.random() * 360) | 0,
    })),
  };

  // ---------- game session ----------
  let game;
  function newGame() {
    game = {
      score: 0, combo: 0, lives: 3, feeds: 0,
      order: null, particles: [], floatFood: null,
      flashT: 0, shake: 0, resolving: false, resolveT: 0,
      scorePulse: 0,
    };
    for (const a of [scene.bunny, scene.cat]) { a.scale = a.targetScale = 1; a.rot = 0; a.happyT = 0; a.shakeT = 0; }
    spawnOrder();
  }
  function currentLimit() { return Math.max(0.75, 2.2 * Math.pow(0.94, game.feeds)); }
  function spawnOrder() {
    const isPancake = Math.random() < 0.5;
    const limit = currentLimit();
    game.order = {
      food: isPancake ? "pancake" : "milkshake",
      want: isPancake ? "bunny" : "cat",
      timeLimit: limit, timeLeft: limit, x: W / 2, y: 300, bob: rand(0, TAU),
    };
    game.resolving = false;
  }

  function spawnParticles(x, y, good) {
    const n = good ? 14 : 7;
    for (let i = 0; i < n; i++) {
      const types = good ? ["heart", "star", "spark"] : ["puff", "brokenheart"];
      game.particles.push({
        x, y, vx: rand(-170, 170), vy: rand(-300, -80),
        life: 1, maxLife: rand(0.6, 1.15),
        type: types[(Math.random() * types.length) | 0],
        size: rand(14, 30), rot: rand(0, TAU), vr: rand(-6, 6),
        hue: good ? [330, 45, 285, 190, 350][(Math.random() * 5) | 0] : 320,
      });
    }
  }

  function feed(animalKind) {
    if (state !== STATE.PLAYING || !game.order || game.resolving) return;
    const order = game.order;
    const animal = animalKind === "bunny" ? scene.bunny : scene.cat;
    const correct = order.want === animalKind;

    if (correct) {
      game.combo++;
      const pts = 10 + Math.floor(game.combo / 3) * 5;
      game.score += pts;
      game.feeds++;
      game.scorePulse = 1;
      animal.happyT = 0.5; animal.targetScale = 1.35;
      game.floatFood = { food: order.food, x: order.x, y: order.y, tx: animal.cx, ty: animal.cy - 34, t: 0 };
      spawnParticles(animal.cx, animal.cy - 50, true);
      beep(true);
    } else {
      registerMiss(animal);
      beep(false);
    }
    game.order = null; game.resolving = true; game.resolveT = 0.18;
  }

  function registerMiss(animalMaybe) {
    game.lives--; game.combo = 0; game.flashT = 0.35; game.shake = 15;
    if (animalMaybe) { animalMaybe.shakeT = 0.5; animalMaybe.targetScale = 0.82; }
    spawnParticles(W / 2, 320, false);
    if (game.lives <= 0) endGame();
  }
  function timeoutMiss() {
    const hungry = game.order.want === "bunny" ? scene.bunny : scene.cat;
    game.order = null; game.resolving = true; game.resolveT = 0.35;
    registerMiss(hungry); beep(false);
  }

  function endGame() {
    state = STATE.GAMEOVER;
    const isNew = game.score > best;
    if (isNew) { best = game.score; localStorage.setItem(BEST_KEY, String(best)); }
    finalScoreEl.textContent = "Score: " + game.score;
    bestScoreEl.textContent = "Best: " + best;
    newBestEl.classList.toggle("hidden", !isNew);
    gameoverScreen.classList.remove("hidden");
    muteBtn.style.display = "none";
  }

  // ---------- audio ----------
  let actx = null;
  function beep(good) {
    if (muted) return;
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      const o = actx.createOscillator(), g = actx.createGain();
      o.connect(g); g.connect(actx.destination);
      const now = actx.currentTime;
      if (good) { o.type = "sine"; o.frequency.setValueAtTime(660, now); o.frequency.exponentialRampToValueAtTime(990, now + 0.12); }
      else { o.type = "square"; o.frequency.setValueAtTime(200, now); o.frequency.exponentialRampToValueAtTime(90, now + 0.2); }
      g.gain.setValueAtTime(0.14, now); g.gain.exponentialRampToValueAtTime(0.0001, now + 0.22);
      o.start(); o.stop(now + 0.24);
    } catch (e) {}
  }

  // ---------- input ----------
  function pointerToLogical(clientX) {
    const rect = canvas.getBoundingClientRect();
    return ((clientX - rect.left) / rect.width) * W;
  }
  canvas.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    if (actx && actx.state === "suspended") actx.resume();
    if (state === STATE.PLAYING) feed(pointerToLogical(e.clientX) < W / 2 ? "bunny" : "cat");
  }, { passive: false });

  document.getElementById("playBtn").addEventListener("click", startPlaying);
  document.getElementById("againBtn").addEventListener("click", startPlaying);
  muteBtn.addEventListener("click", () => {
    muted = !muted; localStorage.setItem("bpcm_muted", muted ? "1" : "0");
    muteBtn.textContent = muted ? "🔇" : "🔊";
  });
  muteBtn.textContent = muted ? "🔇" : "🔊";

  function startPlaying() {
    try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); actx.resume(); } catch (e) {}
    titleScreen.classList.add("hidden");
    gameoverScreen.classList.add("hidden");
    muteBtn.style.display = "block";
    newGame();
    state = STATE.PLAYING;
  }

  // ---------- update ----------
  function update(dt) {
    scene.t += dt;
    for (const c of scene.clouds) { c.x += c.spd * dt; if (c.x > W + 90) c.x = -90; }
    for (const s of scene.sprinkles) {
      s.y += s.vy * dt; s.rot += s.vr * dt;
      if (s.y > H + 20) { s.y = -20; s.x = rand(0, W); }
    }
    for (const a of [scene.bunny, scene.cat]) {
      a.targetScale += (1 - a.targetScale) * Math.min(1, dt * 8);
      a.scale += (a.targetScale - a.scale) * Math.min(1, dt * 16);
      if (a.happyT > 0) a.happyT -= dt;
      if (a.shakeT > 0) { a.shakeT -= dt; a.rot = Math.sin(a.shakeT * 40) * 0.25; }
      else a.rot += (0 - a.rot) * Math.min(1, dt * 12);
      a.blinkT -= dt;
      if (a.blinkT <= 0) { a.blink = 0.12; a.blinkT = rand(2, 5); }
      if (a.blink > 0) a.blink -= dt;
    }

    if (state !== STATE.PLAYING) return;
    if (game.scorePulse > 0) game.scorePulse -= dt * 3;

    if (game.order) {
      game.order.timeLeft -= dt; game.order.bob += dt * 6;
      if (game.order.timeLeft <= 0) timeoutMiss();
    } else if (game.resolving) {
      game.resolveT -= dt;
      if (game.resolveT <= 0 && game.lives > 0) spawnOrder();
    }

    if (game.floatFood) {
      const f = game.floatFood; f.t += dt * 4;
      f.x += (f.tx - f.x) * Math.min(1, dt * 12);
      f.y += (f.ty - f.y) * Math.min(1, dt * 12);
      if (f.t >= 1) game.floatFood = null;
    }
    for (const p of game.particles) {
      p.life -= dt / p.maxLife; p.x += p.vx * dt; p.y += p.vy * dt;
      p.vy += 520 * dt; p.rot += p.vr * dt;
    }
    game.particles = game.particles.filter(p => p.life > 0);
    if (game.flashT > 0) game.flashT -= dt;
    if (game.shake > 0) game.shake = Math.max(0, game.shake - dt * 40);
  }

  // ================= drawing =================
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); }
  function ellipse(x, y, rx, ry, rot) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot || 0, 0, TAU); }

  function drawBackground() {
    // sky
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, "#ffe9f7"); sky.addColorStop(0.45, "#ffcfec"); sky.addColorStop(1, "#ffb6df");
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);

    // sun glow top-right
    const sun = ctx.createRadialGradient(W - 60, 80, 10, W - 60, 80, 220);
    sun.addColorStop(0, "rgba(255,240,170,.9)"); sun.addColorStop(1, "rgba(255,240,170,0)");
    ctx.fillStyle = sun; circle(W - 60, 80, 220); ctx.fill();

    // rainbow arc top-left
    const rc = ["#ff8fb2", "#ffc36b", "#fff07a", "#8fe6a6", "#8fd0ff"];
    ctx.lineWidth = 12; ctx.lineCap = "round";
    for (let i = 0; i < rc.length; i++) {
      ctx.strokeStyle = rc[i];
      ctx.beginPath(); ctx.arc(-30, 30, 150 - i * 13, 0.05, Math.PI * 0.52); ctx.stroke();
    }

    // clouds
    for (const c of scene.clouds) drawCloud(c.x, c.y, c.s);

    // sprinkles (candy confetti)
    for (const s of scene.sprinkles) {
      ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(s.rot);
      ctx.strokeStyle = "hsl(" + s.hue + ",90%,72%)"; ctx.lineWidth = 5; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(-s.len / 2, 0); ctx.lineTo(s.len / 2, 0); ctx.stroke();
      ctx.restore();
    }

    // glossy floor band
    const floorY = H - 300;
    const fg = ctx.createLinearGradient(0, floorY, 0, H);
    fg.addColorStop(0, "#ffd98f"); fg.addColorStop(1, "#ffb45e");
    ctx.fillStyle = fg;
    ctx.beginPath(); ctx.moveTo(0, floorY + 30);
    ctx.quadraticCurveTo(W / 2, floorY - 18, W, floorY + 30);
    ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath(); ctx.fill();
    // polka dots on floor
    ctx.fillStyle = "rgba(255,255,255,.35)";
    for (let yy = floorY + 60; yy < H; yy += 70)
      for (let xx = 30 + ((yy / 70) % 2) * 35; xx < W; xx += 70) { circle(xx, yy, 9); ctx.fill(); }

    // two candy platforms
    drawPlatform(scene.bunny.cx, scene.bunny.cy + 96, "#b6f2cf", "#7fd6a6");
    drawPlatform(scene.cat.cx, scene.cat.cy + 96, "#ffd0b0", "#ff9e6b");
  }

  function drawCloud(x, y, s) {
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
    ctx.fillStyle = "rgba(255,255,255,.92)";
    circle(0, 0, 26); ctx.fill(); circle(24, 6, 20); ctx.fill();
    circle(-24, 6, 20); ctx.fill(); ellipse(0, 14, 40, 16); ctx.fill();
    ctx.restore();
  }
  function drawPlatform(x, y, top, bot) {
    ctx.save();
    const g = ctx.createLinearGradient(0, y - 22, 0, y + 22); g.addColorStop(0, top); g.addColorStop(1, bot);
    ctx.fillStyle = g; ellipse(x, y, 96, 30); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.4)"; ellipse(x, y - 8, 78, 14); ctx.fill();
    ctx.restore();
  }

  // ---- characters ----
  function eyes(open, spread, ey, r) {
    // whites + pupils with glint; open in [0..1]
    for (const sx of [-spread, spread]) {
      ctx.fillStyle = "#3a2233";
      if (open > 0.4) {
        ellipse(sx, ey, r, r * 1.15); ctx.fill();
        ctx.fillStyle = "#fff"; circle(sx - r * 0.3, ey - r * 0.4, r * 0.36); ctx.fill();
        ctx.fillStyle = "rgba(255,255,255,.6)"; circle(sx + r * 0.35, ey + r * 0.3, r * 0.18); ctx.fill();
      } else {
        // happy closed arc ^_^
        ctx.strokeStyle = "#3a2233"; ctx.lineWidth = 4; ctx.lineCap = "round";
        ctx.beginPath(); ctx.arc(sx, ey + 3, r, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
      }
    }
  }
  function blush(spread, y, r) {
    ctx.fillStyle = "rgba(255,130,180,.55)";
    ellipse(-spread, y, r, r * 0.7); ctx.fill();
    ellipse(spread, y, r, r * 0.7); ctx.fill();
  }

  function drawBunny(a) {
    const happy = a.happyT > 0, sad = a.shakeT > 0;
    const bounce = happy ? Math.sin(a.happyT * 26) * 8 : Math.sin(scene.t * 2 + 1) * 3;
    ctx.save();
    ctx.translate(a.cx, a.cy - bounce);
    ctx.rotate(a.rot);
    ctx.scale(a.scale, a.scale);

    const white = "#fffdfb", shade = "#f3e6ef", inner = "#ff9ec4";
    // ears
    const wob = Math.sin(scene.t * 2.2) * 0.05;
    for (const side of [-1, 1]) {
      ctx.save(); ctx.translate(side * 20, -58); ctx.rotate(side * (0.12 + wob));
      ctx.fillStyle = white; ellipse(0, -34, 15, 44); ctx.fill();
      ctx.fillStyle = inner; ellipse(0, -34, 7, 32); ctx.fill();
      ctx.restore();
    }
    // body
    ctx.fillStyle = white; ellipse(0, 46, 46, 44); ctx.fill();
    ctx.fillStyle = shade; ellipse(0, 60, 40, 28); ctx.fill();
    // feet
    ctx.fillStyle = white; ellipse(-22, 82, 16, 11); ctx.fill(); ellipse(22, 82, 16, 11); ctx.fill();
    // arms
    ctx.fillStyle = white; ellipse(-38, 44, 11, 20, -0.3); ctx.fill(); ellipse(38, 44, 11, 20, 0.3); ctx.fill();
    // head
    ctx.fillStyle = white; circle(0, -6, 42); ctx.fill();
    // face
    blush(24, 4, 11);
    eyes(sad ? 1 : (a.blink > 0 ? 0 : 1), 17, -6, 9);
    // nose + mouth
    ctx.fillStyle = "#ff7db0"; ellipse(0, 8, 5, 4); ctx.fill();
    ctx.strokeStyle = "#3a2233"; ctx.lineWidth = 2.5; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(0, 12); ctx.lineTo(0, 16);
    ctx.arc(-5, 16, 5, 0, Math.PI); ctx.moveTo(0, 16); ctx.arc(5, 16, 5, Math.PI, 0); ctx.stroke();
    ctx.restore();
  }

  function drawCat(a) {
    const happy = a.happyT > 0, sad = a.shakeT > 0;
    const bounce = happy ? Math.sin(a.happyT * 26) * 8 : Math.sin(scene.t * 2 + 3) * 3;
    ctx.save();
    ctx.translate(a.cx, a.cy - bounce);
    ctx.rotate(a.rot);
    ctx.scale(a.scale, a.scale);

    const body = "#cdbdf2", shade = "#b9a6e8", inner = "#ff9ec4";
    // tail
    ctx.strokeStyle = body; ctx.lineWidth = 14; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(34, 66); ctx.quadraticCurveTo(66, 58, 58, 24); ctx.stroke();
    // body
    ctx.fillStyle = body; ellipse(0, 50, 44, 44); ctx.fill();
    ctx.fillStyle = "#efe9fb"; ellipse(0, 62, 30, 26); ctx.fill(); // belly
    // feet
    ctx.fillStyle = body; ellipse(-20, 84, 15, 10); ctx.fill(); ellipse(20, 84, 15, 10); ctx.fill();
    // head
    ctx.fillStyle = body; circle(0, -4, 40); ctx.fill();
    // ears
    for (const side of [-1, 1]) {
      ctx.fillStyle = body;
      ctx.beginPath(); ctx.moveTo(side * 14, -34); ctx.lineTo(side * 40, -60); ctx.lineTo(side * 40, -26); ctx.closePath(); ctx.fill();
      ctx.fillStyle = inner;
      ctx.beginPath(); ctx.moveTo(side * 20, -34); ctx.lineTo(side * 34, -50); ctx.lineTo(side * 34, -30); ctx.closePath(); ctx.fill();
    }
    // face
    blush(23, 6, 10);
    eyes(sad ? 1 : (a.blink > 0 ? 0 : 1), 16, -4, 9);
    // nose
    ctx.fillStyle = "#ff7db0";
    ctx.beginPath(); ctx.moveTo(0, 8); ctx.lineTo(-4, 4); ctx.lineTo(4, 4); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "#3a2233"; ctx.lineWidth = 2.5; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(0, 8); ctx.lineTo(0, 12);
    ctx.arc(-4, 12, 4, 0, Math.PI); ctx.moveTo(0, 12); ctx.arc(4, 12, 4, Math.PI, 0); ctx.stroke();
    // whiskers
    ctx.lineWidth = 2;
    for (const side of [-1, 1]) for (const dy of [-3, 3]) {
      ctx.beginPath(); ctx.moveTo(side * 12, 4 + dy); ctx.lineTo(side * 40, 2 + dy * 2.2); ctx.stroke();
    }
    ctx.restore();
  }

  // ---- food ----
  function drawPancakes(x, y, s) {
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
    for (let i = 0; i < 3; i++) {
      const yy = 14 - i * 13;
      ctx.fillStyle = i % 2 ? "#e0a862" : "#efc07a";
      ellipse(0, yy, 40, 13); ctx.fill();
      ctx.fillStyle = "#c98a44"; ellipse(0, yy + 4, 40, 9); ctx.globalCompositeOperation = "source-atop"; ctx.fill();
      ctx.globalCompositeOperation = "source-over";
    }
    // butter
    ctx.fillStyle = "#fff0a6"; roundRect(-12, -30, 24, 16, 5); ctx.fill();
    ctx.fillStyle = "#ffe36b"; roundRect(-12, -30, 24, 8, 4); ctx.fill();
    // syrup
    ctx.fillStyle = "#a5632a";
    ctx.beginPath();
    ctx.moveTo(-34, -12);
    ctx.bezierCurveTo(-30, 2, 30, 2, 34, -12);
    ctx.bezierCurveTo(30, -4, 22, 8, 16, 2);
    ctx.bezierCurveTo(8, 12, -8, 0, -16, 6);
    ctx.bezierCurveTo(-24, 0, -30, -4, -34, -12);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.25)"; ellipse(-10, -18, 10, 3); ctx.fill();
    ctx.restore();
  }

  function drawMilkshake(x, y, s) {
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
    // glass
    ctx.beginPath();
    ctx.moveTo(-24, -18); ctx.lineTo(24, -18); ctx.lineTo(17, 40);
    ctx.quadraticCurveTo(0, 46, -17, 40); ctx.closePath();
    const g = ctx.createLinearGradient(-24, -18, 24, 40);
    g.addColorStop(0, "#ffd0e6"); g.addColorStop(1, "#ff9ecb"); ctx.fillStyle = g; ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.4)"; roundRect(-18, -12, 7, 46, 3); ctx.fill();
    // rim
    ctx.fillStyle = "#fff"; ellipse(0, -18, 24, 7); ctx.fill();
    // whipped cream
    ctx.fillStyle = "#fff";
    circle(-11, -26, 11); ctx.fill(); circle(9, -28, 12); ctx.fill(); circle(-1, -34, 12); ctx.fill();
    // cherry
    ctx.fillStyle = "#ff3b5c"; circle(0, -46, 8); ctx.fill();
    ctx.strokeStyle = "#7a4b28"; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(0, -52); ctx.quadraticCurveTo(8, -60, 6, -66); ctx.stroke();
    // straw
    ctx.strokeStyle = "#ff5fb0"; ctx.lineWidth = 6; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(12, -30); ctx.lineTo(26, -60); ctx.stroke();
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 6; ctx.setLineDash([5, 6]);
    ctx.beginPath(); ctx.moveTo(12, -30); ctx.lineTo(26, -60); ctx.stroke(); ctx.setLineDash([]);
    ctx.restore();
  }
  function drawFood(food, x, y, s) { food === "pancake" ? drawPancakes(x, y, s) : drawMilkshake(x, y, s); }

  // ---- particles ----
  function drawParticle(p) {
    ctx.save(); ctx.globalAlpha = clamp(p.life, 0, 1); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    const col = "hsl(" + p.hue + ",90%,68%)";
    if (p.type === "heart" || p.type === "brokenheart") {
      ctx.fillStyle = p.type === "brokenheart" ? "#b98bb0" : col;
      const r = p.size / 2;
      ctx.beginPath();
      ctx.moveTo(0, r * 0.7);
      ctx.bezierCurveTo(r, -r * 0.4, r * 0.6, -r, 0, -r * 0.3);
      ctx.bezierCurveTo(-r * 0.6, -r, -r, -r * 0.4, 0, r * 0.7);
      ctx.fill();
    } else if (p.type === "star") {
      ctx.fillStyle = col; star(0, 0, 5, p.size / 2, p.size / 4);
    } else if (p.type === "spark") {
      ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.lineCap = "round";
      for (let i = 0; i < 4; i++) { ctx.rotate(Math.PI / 2); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, p.size / 2); ctx.stroke(); }
    } else { ctx.fillStyle = "rgba(200,180,200,.7)"; circle(0, 0, p.size / 2); ctx.fill(); }
    ctx.restore();
  }
  function star(cx, cy, spikes, outer, inner) {
    let rot = -Math.PI / 2; const step = Math.PI / spikes;
    ctx.beginPath(); ctx.moveTo(cx, cy - outer);
    for (let i = 0; i < spikes; i++) {
      ctx.lineTo(cx + Math.cos(rot) * outer, cy + Math.sin(rot) * outer); rot += step;
      ctx.lineTo(cx + Math.cos(rot) * inner, cy + Math.sin(rot) * inner); rot += step;
    }
    ctx.closePath(); ctx.fill();
  }

  // ---- order plate + ring + HUD ----
  function drawOrder() {
    const o = game.order; const oy = o.y + Math.sin(o.bob) * 9;
    // hint bubble
    ctx.fillStyle = "rgba(255,255,255,.9)";
    roundRect(W / 2 - 92, oy - 132, 184, 40, 20); ctx.fill();
    ctx.fillStyle = "#e0338f"; ctx.font = "700 22px " + FONT; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("who wants this?", W / 2, oy - 111);
    // plate
    ctx.fillStyle = "rgba(255,255,255,.95)"; ellipse(o.x, oy + 34, 72, 20); ctx.fill();
    ctx.fillStyle = "rgba(0,0,0,.05)"; ellipse(o.x, oy + 36, 56, 12); ctx.fill();
    // ring
    const frac = clamp(o.timeLeft / o.timeLimit, 0, 1);
    ctx.lineWidth = 11; ctx.lineCap = "round";
    ctx.strokeStyle = "rgba(255,255,255,.65)"; circle(o.x, oy, 66); ctx.stroke();
    ctx.strokeStyle = frac > 0.4 ? "#4fd18b" : (frac > 0.2 ? "#ffb038" : "#ff3b6b");
    ctx.beginPath(); ctx.arc(o.x, oy, 66, -Math.PI / 2, -Math.PI / 2 + frac * TAU); ctx.stroke();
    // food
    drawFood(o.food, o.x, oy, 1.0);
  }

  function pill(x, y, w, h) { roundRect(x, y, w, h, h / 2); }
  function drawHUD() {
    // score pill
    ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.fillStyle = "#fff"; pill(16, 18, 172, 52); ctx.fill();
    ctx.fillStyle = "#ffb038"; ctx.font = "700 26px " + FONT_B;
    const sc = 1 + Math.max(0, game.scorePulse) * 0.25;
    ctx.save(); ctx.translate(34, 44); ctx.scale(sc, sc);
    ctx.fillText("★", 0, 1); ctx.fillStyle = "#e0338f"; ctx.fillText("  " + game.score, 6, 1); ctx.restore();
    // best under score
    ctx.fillStyle = "rgba(255,255,255,.85)"; pill(16, 76, 118, 30); ctx.fill();
    ctx.fillStyle = "#e0338f"; ctx.font = "700 15px " + FONT; ctx.fillText("Best " + best, 30, 92);
    // hearts
    ctx.textAlign = "center";
    for (let i = 0; i < 3; i++) {
      const hx = W - 34 - i * 42, hy = 44, on = i < game.lives;
      ctx.save(); ctx.translate(hx, hy); ctx.scale(1.5, 1.5);
      ctx.fillStyle = on ? "#ff4f8b" : "rgba(255,255,255,.45)";
      ctx.beginPath(); ctx.moveTo(0, 7);
      ctx.bezierCurveTo(9, -4, 6, -10, 0, -4);
      ctx.bezierCurveTo(-6, -10, -9, -4, 0, 7); ctx.fill();
      if (on) { ctx.fillStyle = "rgba(255,255,255,.6)"; circle(-2.5, -2, 1.6); ctx.fill(); }
      ctx.restore();
    }
    // combo banner
    if (game.combo >= 3) {
      ctx.textAlign = "center";
      const s = 1 + Math.sin(scene.t * 10) * 0.05;
      ctx.save(); ctx.translate(W / 2, 128); ctx.scale(s, s);
      ctx.font = "800 30px " + FONT_B;
      ctx.lineWidth = 6; ctx.strokeStyle = "#fff"; ctx.strokeText("COMBO x" + game.combo, 0, 0);
      ctx.fillStyle = "#ff4fae"; ctx.fillText("COMBO x" + game.combo, 0, 0);
      ctx.restore();
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    let sx = 0, sy = 0;
    if (state === STATE.PLAYING && game.shake > 0) { sx = rand(-game.shake, game.shake); sy = rand(-game.shake, game.shake); }
    ctx.save(); ctx.translate(sx, sy);

    drawBackground();
    // draw front-standing animals (cat behind tail already handled)
    drawBunny(scene.bunny);
    drawCat(scene.cat);
    // what each eats — little floating icons
    if (state === STATE.PLAYING) {
      drawFood("pancake", scene.bunny.cx, scene.bunny.cy + 128, 0.5);
      drawFood("milkshake", scene.cat.cx, scene.cat.cy + 128, 0.5);
      if (game.order) drawOrder();
      if (game.floatFood) drawFood(game.floatFood.food, game.floatFood.x, game.floatFood.y, 0.9 * (1 - game.floatFood.t * 0.4));
      for (const p of game.particles) drawParticle(p);
    }
    ctx.restore();

    if (state === STATE.PLAYING) drawHUD();
    if (state === STATE.PLAYING && game.flashT > 0) {
      ctx.fillStyle = "rgba(255,60,110," + (game.flashT * 0.55) + ")"; ctx.fillRect(0, 0, W, H);
    }
  }

  // ---------- loop ----------
  let last = 0;
  function frame(t) {
    if (!last) last = t;
    let dt = (t - last) / 1000; last = t; dt = Math.min(dt, 0.05);
    update(dt); draw();
    requestAnimationFrame(frame);
  }

  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => {});
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
