<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Bunny Pancake, Cat Milkshake</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "Baloo 2", "Comic Sans MS", "Trebuchet MS", system-ui, sans-serif;
    background: #ffd7ef;
    display: flex; align-items: center; justify-content: center;
    touch-action: manipulation; user-select: none; -webkit-user-select: none;
  }
  #stage {
    position: relative;
    width: 100%; height: 100%;
    max-width: 520px; max-height: 100vh;
    background: linear-gradient(180deg, #ffe3f4 0%, #ffd0ec 45%, #ffc2e6 100%);
    overflow: hidden;
  }
  canvas { display: block; width: 100%; height: 100%; }

  /* overlays */
  .overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px; gap: 18px;
    background: rgba(255, 220, 240, 0.72);
    backdrop-filter: blur(4px);
    z-index: 10;
  }
  .hidden { display: none !important; }
  .title {
    font-size: clamp(30px, 9vw, 52px); line-height: 1.05; font-weight: 800;
    color: #b83d8c; text-shadow: 0 3px 0 #fff, 0 6px 12px rgba(184,61,140,.25);
  }
  .subtitle { font-size: clamp(15px, 4.5vw, 20px); color: #a24d86; max-width: 360px; }
  .emoji-row { font-size: clamp(40px, 13vw, 64px); }
  .btn {
    font: inherit; font-weight: 800; font-size: clamp(20px, 6vw, 26px);
    color: #fff; background: linear-gradient(180deg,#ff86c8,#ff4fae);
    border: none; border-radius: 999px; padding: 16px 40px; cursor: pointer;
    box-shadow: 0 6px 0 #d62e8a, 0 10px 18px rgba(214,46,138,.35);
    transition: transform .06s ease;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #d62e8a, 0 4px 10px rgba(214,46,138,.35); }
  .final-score { font-size: clamp(24px, 8vw, 40px); font-weight: 800; color:#b83d8c; }
  .best { font-size: clamp(16px,5vw,22px); color:#a24d86; }
  .credit { position:absolute; bottom:10px; left:0; right:0; font-size:12px; color:#c46aa3; opacity:.8;}
</style>
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>

  <div id="titleScreen" class="overlay">
    <div class="emoji-row">🐰🥞&nbsp;&nbsp;🥤🐱</div>
    <div class="title">Bunny Pancake<br>Cat Milkshake</div>
    <div class="subtitle">Feed pancakes 🥞 to the bunny 🐰 and milkshakes 🥤 to the cat 🐱. Tap the right side before time runs out!</div>
    <button id="playBtn" class="btn">Play!</button>
    <div class="credit">Inspired by Wreck-It Ralph 2</div>
  </div>

  <div id="gameoverScreen" class="overlay hidden">
    <div class="emoji-row">😺🥞🐰🥤</div>
    <div class="title" style="font-size:clamp(26px,8vw,44px)">Yummy!</div>
    <div class="final-score" id="finalScore">Score: 0</div>
    <div class="best" id="bestScore">Best: 0</div>
    <button id="againBtn" class="btn">Play Again</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const stage = document.getElementById("stage");

  const titleScreen = document.getElementById("titleScreen");
  const gameoverScreen = document.getElementById("gameoverScreen");
  const finalScoreEl = document.getElementById("finalScore");
  const bestScoreEl = document.getElementById("bestScore");

  // ---- logical resolution (portrait). We render to this and scale via CSS. ----
  const W = 520, H = 900;
  let DPR = 1;

  function resize() {
    const rect = stage.getBoundingClientRect();
    DPR = Math.min(window.devicePixelRatio || 1, 3);
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    // CSS already stretches canvas to fill stage; keep internal coords fixed at W/H.
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener("resize", resize);

  // ---- helpers ----
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

  // ---- game state ----
  const STATE = { TITLE: 0, PLAYING: 1, GAMEOVER: 2 };
  let state = STATE.TITLE;

  const BEST_KEY = "bpcm_best";
  let best = parseInt(localStorage.getItem(BEST_KEY) || "0", 10) || 0;

  // Animals live in the bottom two zones.
  function makeAnimal(kind, emoji, cx) {
    return {
      kind, emoji, cx,
      cy: H - 150,
      scale: 1, targetScale: 1,
      rot: 0,            // wobble angle
      shakeT: 0,         // sad-shake timer
      happyT: 0,         // happy-bounce timer
    };
  }

  let game;

  function newGame() {
    game = {
      score: 0,
      combo: 0,
      lives: 3,
      // order = { food: "pancake"|"milkshake", emoji, timeLimit, timeLeft }
      order: null,
      timeLimit: 2.2,
      minLimit: 0.75,
      feeds: 0,
      bunny: makeAnimal("bunny", "🐰", W * 0.28),
      cat: makeAnimal("cat", "🐱", W * 0.72),
      particles: [],
      flashT: 0,        // red miss flash
      shake: 0,         // screen shake magnitude
      floatFood: null,  // the food that animates from center to the animal on feed
      resolving: false, // brief pause between orders
      resolveT: 0,
    };
    spawnOrder();
  }

  function currentLimit() {
    // shrink ~6% per feed toward the floor
    return Math.max(game.minLimit, 2.2 * Math.pow(0.94, game.feeds));
  }

  function spawnOrder() {
    const isPancake = Math.random() < 0.5;
    const limit = currentLimit();
    game.order = {
      food: isPancake ? "pancake" : "milkshake",
      emoji: isPancake ? "🥞" : "🥤",
      want: isPancake ? "bunny" : "cat",
      timeLimit: limit,
      timeLeft: limit,
      x: W / 2,
      y: 300,
      bob: 0,
    };
    game.resolving = false;
  }

  function spawnParticles(x, y, good) {
    const emojis = good ? ["✨", "💕", "⭐", "🌟", "💖"] : ["💥", "😿"];
    const n = good ? 10 : 6;
    for (let i = 0; i < n; i++) {
      game.particles.push({
        x, y,
        vx: rand(-140, 140),
        vy: rand(-260, -60),
        life: 1, maxLife: rand(0.6, 1.1),
        emoji: emojis[(Math.random() * emojis.length) | 0],
        size: rand(20, 34),
        rot: rand(-1, 1), vr: rand(-4, 4),
      });
    }
  }

  // ---- feeding logic ----
  function feed(animalKind) {
    if (state !== STATE.PLAYING || !game.order || game.resolving) return;
    const order = game.order;
    const animal = animalKind === "bunny" ? game.bunny : game.cat;
    const correct = order.want === animalKind;

    if (correct) {
      game.combo++;
      const pts = 10 + Math.floor(game.combo / 3) * 5;
      game.score += pts;
      game.feeds++;
      animal.happyT = 0.45;
      animal.targetScale = 1.35;
      // fling the food to the animal
      game.floatFood = { emoji: order.emoji, x: order.x, y: order.y, tx: animal.cx, ty: animal.cy - 30, t: 0 };
      spawnParticles(animal.cx, animal.cy - 40, true);
      beep(correct);
    } else {
      registerMiss(animal);
      beep(false);
    }

    // brief resolve gap, then next order
    game.order = null;
    game.resolving = true;
    game.resolveT = 0.18;
  }

  function registerMiss(animalMaybe) {
    game.lives--;
    game.combo = 0;
    game.flashT = 0.35;
    game.shake = 14;
    if (animalMaybe) { animalMaybe.shakeT = 0.5; animalMaybe.targetScale = 0.8; }
    spawnParticles(W / 2, 320, false);
    if (game.lives <= 0) endGame();
  }

  function timeoutMiss() {
    game.order = null;
    game.resolving = true;
    game.resolveT = 0.35;
    // whichever animal was hungry does the sad shake
    registerMiss(null);
    beep(false);
  }

  function endGame() {
    state = STATE.GAMEOVER;
    if (game.score > best) {
      best = game.score;
      localStorage.setItem(BEST_KEY, String(best));
    }
    finalScoreEl.textContent = "Score: " + game.score;
    bestScoreEl.textContent = "Best: " + best;
    gameoverScreen.classList.remove("hidden");
  }

  // ---- tiny WebAudio blips (no asset files) ----
  let actx = null;
  function beep(good) {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      const o = actx.createOscillator();
      const g = actx.createGain();
      o.connect(g); g.connect(actx.destination);
      if (good) {
        o.type = "sine";
        o.frequency.setValueAtTime(660, actx.currentTime);
        o.frequency.exponentialRampToValueAtTime(990, actx.currentTime + 0.12);
      } else {
        o.type = "square";
        o.frequency.setValueAtTime(200, actx.currentTime);
        o.frequency.exponentialRampToValueAtTime(90, actx.currentTime + 0.2);
      }
      g.gain.setValueAtTime(0.14, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + 0.22);
      o.start();
      o.stop(actx.currentTime + 0.24);
    } catch (e) { /* audio optional */ }
  }

  // ---- input ----
  function pointerToLogical(clientX) {
    const rect = canvas.getBoundingClientRect();
    return ((clientX - rect.left) / rect.width) * W;
  }

  function onPress(clientX, clientY) {
    if (state === STATE.PLAYING) {
      const lx = pointerToLogical(clientX);
      feed(lx < W / 2 ? "bunny" : "cat");
    }
  }

  canvas.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    if (actx && actx.state === "suspended") actx.resume();
    onPress(e.clientX, e.clientY);
  }, { passive: false });

  document.getElementById("playBtn").addEventListener("click", startPlaying);
  document.getElementById("againBtn").addEventListener("click", startPlaying);

  function startPlaying() {
    try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); actx.resume(); } catch (e) {}
    titleScreen.classList.add("hidden");
    gameoverScreen.classList.add("hidden");
    newGame();
    state = STATE.PLAYING;
  }

  // ---- update ----
  function update(dt) {
    if (state !== STATE.PLAYING) return;

    // order timer
    if (game.order) {
      game.order.timeLeft -= dt;
      game.order.bob += dt * 6;
      if (game.order.timeLeft <= 0) timeoutMiss();
    } else if (game.resolving) {
      game.resolveT -= dt;
      if (game.resolveT <= 0 && game.lives > 0) spawnOrder();
    }

    // animals ease back to rest
    for (const a of [game.bunny, game.cat]) {
      a.targetScale += (1 - a.targetScale) * Math.min(1, dt * 8);
      a.scale += (a.targetScale - a.scale) * Math.min(1, dt * 16);
      if (a.happyT > 0) a.happyT -= dt;
      if (a.shakeT > 0) { a.shakeT -= dt; a.rot = Math.sin(a.shakeT * 40) * 0.25; }
      else a.rot += (0 - a.rot) * Math.min(1, dt * 12);
    }

    // float food toward animal
    if (game.floatFood) {
      const f = game.floatFood;
      f.t += dt * 4;
      f.x += (f.tx - f.x) * Math.min(1, dt * 12);
      f.y += (f.ty - f.y) * Math.min(1, dt * 12);
      if (f.t >= 1) game.floatFood = null;
    }

    // particles
    for (const p of game.particles) {
      p.life -= dt / p.maxLife;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 520 * dt;
      p.rot += p.vr * dt;
    }
    game.particles = game.particles.filter(p => p.life > 0);

    // flashes / shake decay
    if (game.flashT > 0) game.flashT -= dt;
    if (game.shake > 0) game.shake = Math.max(0, game.shake - dt * 40);
  }

  // ---- draw ----
  function drawEmoji(emoji, x, y, size, rot, scale) {
    ctx.save();
    ctx.translate(x, y);
    if (rot) ctx.rotate(rot);
    if (scale && scale !== 1) ctx.scale(scale, scale);
    ctx.font = size + "px serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(emoji, 0, 0);
    ctx.restore();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    let sx = 0, sy = 0;
    if (state === STATE.PLAYING && game.shake > 0) {
      sx = rand(-game.shake, game.shake);
      sy = rand(-game.shake, game.shake);
    }
    ctx.save();
    ctx.translate(sx, sy);

    // background stripes / floor for the two zones
    // bunny zone (left) pale mint, cat zone (right) pale peach
    ctx.fillStyle = "rgba(198,240,220,0.55)";
    ctx.fillRect(0, H - 300, W / 2, 300);
    ctx.fillStyle = "rgba(255,224,196,0.55)";
    ctx.fillRect(W / 2, H - 300, W / 2, 300);
    // divider
    ctx.strokeStyle = "rgba(255,255,255,0.7)";
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(W / 2, H - 300); ctx.lineTo(W / 2, H); ctx.stroke();

    if (state === STATE.PLAYING) {
      drawPlaying();
    }

    ctx.restore();

    // red miss flash on top
    if (state === STATE.PLAYING && game.flashT > 0) {
      ctx.fillStyle = "rgba(255,60,90," + (game.flashT * 0.7) + ")";
      ctx.fillRect(0, 0, W, H);
    }
  }

  function drawPlaying() {
    // ground pads under animals
    for (const a of [game.bunny, game.cat]) {
      ctx.fillStyle = "rgba(255,255,255,0.35)";
      ctx.beginPath();
      ctx.ellipse(a.cx, a.cy + 78, 92, 26, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    // animals
    const bob = (a) => a.happyT > 0 ? Math.sin(a.happyT * 24) * 10 : 0;
    drawEmoji(game.bunny.emoji, game.bunny.cx, game.bunny.cy - bob(game.bunny), 130, game.bunny.rot, game.bunny.scale);
    drawEmoji(game.cat.emoji, game.cat.cx, game.cat.cy - bob(game.cat), 130, game.cat.rot, game.cat.scale);

    // labels of what each eats
    ctx.font = "26px serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("🥞", game.bunny.cx, game.bunny.cy + 78);
    ctx.fillText("🥤", game.cat.cx, game.cat.cy + 78);

    // current order + countdown ring
    if (game.order) {
      const o = game.order;
      const oy = o.y + Math.sin(o.bob) * 8;
      // ring
      const frac = clamp(o.timeLeft / o.timeLimit, 0, 1);
      const R = 74;
      ctx.lineWidth = 12;
      ctx.strokeStyle = "rgba(255,255,255,0.6)";
      ctx.beginPath(); ctx.arc(o.x, oy, R, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = frac > 0.4 ? "#54d69b" : (frac > 0.2 ? "#ffb038" : "#ff4f6d");
      ctx.beginPath();
      ctx.arc(o.x, oy, R, -Math.PI / 2, -Math.PI / 2 + frac * Math.PI * 2);
      ctx.stroke();
      // speech-bubble hint + food
      drawEmoji(o.emoji, o.x, oy, 78, 0, 1);
      ctx.font = "20px sans-serif"; ctx.fillStyle = "#a24d86";
      ctx.fillText("who wants this?", o.x, oy - 108);
    }

    // floating food being eaten
    if (game.floatFood) {
      const f = game.floatFood;
      drawEmoji(f.emoji, f.x, f.y, 60 * (1 - f.t * 0.5), 0, 1);
    }

    // particles
    for (const p of game.particles) {
      ctx.globalAlpha = clamp(p.life, 0, 1);
      drawEmoji(p.emoji, p.x, p.y, p.size, p.rot, 1);
    }
    ctx.globalAlpha = 1;

    // HUD
    drawHUD();
  }

  function drawHUD() {
    // score pill
    ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.fillStyle = "rgba(255,255,255,0.85)";
    roundRect(16, 20, 190, 54, 27); ctx.fill();
    ctx.fillStyle = "#b83d8c"; ctx.font = "700 30px sans-serif";
    ctx.fillText("⭐ " + game.score, 34, 48);

    // lives (hearts) top-right
    ctx.textAlign = "right";
    ctx.font = "30px serif";
    let hearts = "";
    for (let i = 0; i < 3; i++) hearts += i < game.lives ? "❤️" : "🖤";
    ctx.fillText(hearts, W - 20, 47);

    // combo
    if (game.combo >= 3) {
      ctx.textAlign = "center";
      ctx.fillStyle = "#ff4fae"; ctx.font = "800 26px sans-serif";
      ctx.fillText("COMBO x" + game.combo + "!", W / 2, 120);
    }

    // best score small
    ctx.textAlign = "left"; ctx.fillStyle = "#a24d86"; ctx.font = "600 16px sans-serif";
    ctx.fillText("Best: " + best, 20, 92);
  }

  // ---- main loop ----
  let last = 0;
  function frame(t) {
    if (!last) last = t;
    let dt = (t - last) / 1000;
    last = t;
    dt = Math.min(dt, 0.05); // clamp big gaps
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
